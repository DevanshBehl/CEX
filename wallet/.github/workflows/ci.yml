# CI gates the merge (prompt_phase1.md rules 17, 193).
#
# Every job here corresponds to a Definition-of-Done item. The dependency-
# boundary job in particular exists to prove the lint rules actually bite
# (rule 188) — a boundary rule nobody has seen fail is a boundary rule that
# might not be wired up.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real secrets never appear in a workflow file
  # (master-prompt rule 158).
  DATABASE_URL: postgresql://wallet_app:wallet_app@localhost:5433/wallet
  MIGRATION_DATABASE_URL: postgresql://wallet_owner:wallet_owner@localhost:5433/wallet
  REDIS_URL: redis://localhost:6380
  # `test`, never `development`: a production `next build` that inherits
  # NODE_ENV=development fails while prerendering /404 with a misleading
  # "<Html> should not be imported outside of pages/_document". The web build
  # script pins NODE_ENV=production for exactly this reason.
  NODE_ENV: test
  LOG_LEVEL: error
  WEB_ORIGIN: http://localhost:3000
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_RP_NAME: Wallet
  WEBAUTHN_ORIGIN: http://localhost:3000
  SESSION_COOKIE_NAME: wallet_session
  SESSION_SECRET: ci-only-session-secret-at-least-32-chars-long
  TOTP_ENCRYPTION_KEY: Y2ktb25seS10b3RwLWtleS0zMi1ieXRlcy0hIQ==
  # Phase 2. Deposit-address derivation only — Phase 2 never signs.
  DEPOSIT_SEED: Y2ktb25seS1kZXBvc2l0LXNlZWQtZm9yLXRlc3RzLW5vdC1yZWFsLW1vbmV5LTEyMzQ1Njc4OQ==
  SOLANA_RPC_URL: http://127.0.0.1:8899
  SOLANA_NETWORK: localnet
  SOLANA_COMMITMENT: finalized
  SUPPORTED_ASSETS: SOL
  # Tests drive the workers by hand; a background timer would make
  # "what happened after N cycles" unanswerable.
  INDEXER_ENABLED: 'false'
  WITHDRAWAL_WORKERS_ENABLED: 'false'
  # Phase 3. `mock` is refused in production by config AND by MockSigner itself.
  SIGNER_KIND: mock
  SIGNER_KEY_REF: ci-treasury
  TREASURY_ADDRESS: BWwVzPxw1AK6LgsSn7GSPj9Stv1o5ENkp4PCru9w3Hvr
  # Raised for CI: two dozen browser journeys from one IP exceed a realistic
  # ceiling, and a throttled /auth/session surfaces as unrelated failures.
  RATE_LIMIT_GLOBAL_PER_MINUTE: '100000'
  RATE_LIMIT_WITHDRAWAL_PER_MINUTE: '100000'
  RATE_LIMIT_AUTH_PER_IP_PER_MINUTE: '100000'

jobs:
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wallet/db generate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Formatting
        run: pnpm format:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # prompt_phase4.md rule 164. The policy lives in
      # docs/security/dependency-exceptions.md and is ENFORCED by the script:
      # a high or critical advisory fails the build unless that package is
      # documented there with a reason and a date. A newly introduced
      # vulnerability is not on the list, so it still breaks CI.
      #
      # Deliberately not `pnpm audit --audit-level high || true`. A custody
      # system whose CI is green with a known-critical dependency is green
      # about the wrong thing.
      - name: JavaScript dependencies
        run: node scripts/audit.mjs

      - name: Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cd services/mpc && cargo audit --deny warnings

  boundaries:
    name: Architectural boundaries actually bite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wallet/db generate
      # rule 188: introduce a deliberate violation and require lint to fail.
      # A boundary rule that has never been seen to fail may not be wired up.
      - run: node scripts/verify-boundaries.mjs

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wallet"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Roles are cluster-scoped and live in the init script; the grants that
      # depend on them are a migration. See migration 0002 for why.
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -f infra/postgres-init/01-roles.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -c "ALTER ROLE wallet_owner CREATEDB;"

      - run: pnpm --filter @wallet/db generate
      - run: pnpm build
      - run: pnpm --filter @wallet/db exec prisma migrate deploy

      # rule 95: the checked-in migrations must fully describe the schema.
      #
      # Through the script, which creates and drops its OWN shadow database.
      # `--shadow-database-url` is destructive to whatever it points at —
      # pointing it at the application database leaves the schema current and
      # the migration history gone.
      - name: Migrations match the schema
        run: pnpm --filter @wallet/db run migrate:check

      # Serial: the suites share one database, and running them concurrently
      # makes one suite's fixtures another's mystery failure.
      - run: pnpm test:integration

  localnet:
    name: Against a real Solana validator
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wallet"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -f infra/postgres-init/01-roles.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -c "ALTER ROLE wallet_owner CREATEDB;"
      - run: pnpm --filter @wallet/db generate
      - run: pnpm build
      - run: pnpm --filter @wallet/db exec prisma migrate deploy

      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Start a validator
        run: |
          solana-test-validator --reset --quiet --ledger /tmp/test-ledger &
          # The localnet suites skip when no validator answers, so without this
          # wait the job would pass by skipping everything it exists to run.
          for i in $(seq 1 60); do
            if curl -s -X POST -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
                 http://127.0.0.1:8899 | grep -q ok; then
              echo "validator healthy"; exit 0
            fi
            sleep 2
          done
          echo "validator never became healthy"; exit 1

      # Includes the SPL token test, which is the only check that the
      # hand-written `Transfer` encoding is accepted by the real program. Every
      # possible mistake in it is silent under unit tests and fatal on-chain.
      - run: pnpm --filter @wallet/solana test:integration
      - run: pnpm --filter @wallet/api test:integration

  # The threshold suite (`tests/threshold.rs`) runs five participant services
  # over real HTTP. It is the only check that 3-of-5 actually holds end to end
  # — the unit tests prove the cryptography, not the wire protocol.
  rust:
    name: MPC service (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mpc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/mpc
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  signer-swap:
    name: Phase 3 suite against the real signer
    runs-on: ubuntu-latest
    # THE exit criterion for Phase 4a (prompt_phase4.md rule 176): the whole
    # Phase 3 suite must pass against RustSingleKeySigner with no changes above
    # the Signer interface.
    #
    # It runs in CI because the first local attempt reported 111 tests passing
    # while sending ZERO requests to the service — every test had injected the
    # mock. `USE_CONFIGURED_SIGNER=true` suppresses that injection, and the
    # assertion below checks the service actually signed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wallet"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/mpc

      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -f infra/postgres-init/01-roles.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -c "ALTER ROLE wallet_owner CREATEDB;"
      - run: pnpm --filter @wallet/db generate
      - run: pnpm build
      - run: pnpm --filter @wallet/db exec prisma migrate deploy

      - name: Generate a caller keypair and a KEK
        id: keys
        run: |
          node -e "
            const { generateKeyPairSync } = require('node:crypto');
            const { privateKey, publicKey } = generateKeyPairSync('ed25519');
            const pem = privateKey.export({ type: 'pkcs8', format: 'pem' });
            const raw = publicKey.export({ type: 'spki', format: 'der' }).subarray(-32);
            console.log('priv=' + Buffer.from(pem).toString('base64'));
            console.log('pub=' + raw.toString('base64'));
            const approval = generateKeyPairSync('ed25519');
            const apem = approval.privateKey.export({ type: 'pkcs8', format: 'pem' });
            const araw = approval.publicKey.export({ type: 'spki', format: 'der' }).subarray(-32);
            console.log('approvalpriv=' + Buffer.from(apem).toString('base64'));
            console.log('approvalpub=' + araw.toString('base64'));
          " >> "$GITHUB_OUTPUT"
          echo "kek=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"

      - name: Generate a TLS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/mpc-key.pem \
            -out /tmp/mpc-cert.pem -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Build and start the MPC service
        env:
          MPC_KEK: ${{ steps.keys.outputs.kek }}
          MPC_CALLER_PUBLIC_KEY: ${{ steps.keys.outputs.pub }}
          MPC_APPROVAL_PUBLIC_KEY: ${{ steps.keys.outputs.approvalpub }}
          MPC_DATABASE_PATH: /tmp/mpc-ci.sqlite
          MPC_BOOTSTRAP_KEY_REF: treasury-hot-1
          MPC_BIND: 127.0.0.1:7070
          # CI runs the deployed shape: TLS on, and authorization proofs
          # cryptographically verified.
          MPC_TLS_CERT: /tmp/mpc-cert.pem
          MPC_TLS_KEY: /tmp/mpc-key.pem
        run: |
          cargo build --release --manifest-path services/mpc/Cargo.toml
          ./services/mpc/target/release/wallet-mpc &
          for i in $(seq 1 30); do
            if curl -skf https://127.0.0.1:7070/v1/health | grep -q '"status":"ok"'; then
              echo "mpc service healthy"; exit 0
            fi
            sleep 1
          done
          echo "mpc service never became healthy"; exit 1

      - name: Run the Phase 3 suite against the real signer
        env:
          SIGNER_KIND: real
          USE_CONFIGURED_SIGNER: 'true'
          MPC_CLIENT_PRIVATE_KEY: ${{ steps.keys.outputs.priv }}
          MPC_APPROVAL_PRIVATE_KEY: ${{ steps.keys.outputs.approvalpriv }}
          MPC_ENDPOINT: https://127.0.0.1:7070
          # A self-signed certificate, for a service on loopback in CI.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: pnpm --filter @wallet/api exec vitest run --config vitest.integration.config.ts

      - name: Assert the service actually signed
        # Without this the job is green when the suite silently falls back to
        # the mock — which is exactly how the first local run fooled me.
        run: |
          SIGNED=$(python3 -c "
          import sqlite3
          c = sqlite3.connect('/tmp/mpc-ci.sqlite')
          print(c.execute(\"SELECT count(*) FROM signing_requests WHERE outcome='succeeded'\").fetchone()[0])
          ")
          echo "signatures produced: $SIGNED"
          if [ "$SIGNED" -lt 1 ]; then
            echo "The suite passed without the MPC service signing anything."
            exit 1
          fi

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wallet"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d wallet \
            -f infra/postgres-init/01-roles.sql
      - run: pnpm --filter @wallet/db generate
      - run: pnpm build
      - run: pnpm --filter @wallet/db exec prisma migrate deploy
      - run: pnpm --filter @wallet/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
