packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 build-script approvals. Anything not listed here does not run
# install scripts (master-prompt rule 156 — least privilege).
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  # Solana SDK native accelerators. Optional — the JS fallbacks are correct,
  # just slower — but the build warns on every install without a decision.
  bigint-buffer: true
  bufferutil: true
  utf-8-validate: true

# zod-to-json-schema >=3.25 imports `zod/v3`, an export map that only exists in
# Zod 4. This monorepo is on Zod 3 (fastify-type-provider-zod@4 requires it),
# so the transitive dependency is pinned to the last Zod-3-compatible line.
overrides:
  zod-to-json-schema: 3.24.5
  # ws <8.21.0 has a high-severity memory-exhaustion DoS in frame handling. The
  # API now accepts WebSocket connections (ADR-0037), so the copy
  # @fastify/websocket and the Solana RPC client resolve must be a patched one.
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
