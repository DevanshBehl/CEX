[package]
name = "wallet-matching"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Deterministic central limit order book. Owns price and priority; owns no money."

[lib]
name = "wallet_matching"
path = "src/lib.rs"
# The default libtest bench harness would otherwise intercept criterion's own
# flags, so `cargo bench -- --measurement-time 2` fails with "Unrecognized
# option" before criterion ever runs.
bench = false

[[bin]]
name = "wallet-matching"
path = "src/main.rs"
bench = false

[dependencies]
# HTTP control plane. The engine's only caller is the gateway; an end user
# never reaches it.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["trace"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Caller authentication (ADR-0031). The engine holds only a PUBLIC key: it
# cannot impersonate its caller, and compromising it yields no ability to sign.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# Egress (ADR-0030). Transport, never the source of truth — that is the journal.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialisation. bincode is deterministic for a given schema, which is what a
# replayable journal needs — a format that reorders fields produces a different
# byte stream from the same command.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
crc32fast = "1"

# Errors and observability
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "matching"
harness = false

[profile.release]
# Same reasoning as services/mpc: a panic mid-command is a state we have not
# reasoned about, and a matching engine that continues from one is a book that
# never existed.
panic = "abort"
